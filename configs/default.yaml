project_root: C:\Users\LENOVO\Documents\HK2 - 2025 - 2026\DL\archive (1)\dataset1\vqa_dataset
image_dir: C:\Users\LENOVO\Documents\HK2 - 2025 - 2026\DL\archive (1)\dataset1\vqa_dataset
train_csv: C:\Users\LENOVO\Documents\HK2 - 2025 - 2026\DL\archive (1)\dataset1\vqa_dataset\train.csv
test_csv: C:\Users\LENOVO\Documents\HK2 - 2025 - 2026\DL\archive (1)\dataset1\vqa_dataset\test.csv
output_dir: C:\Users\LENOVO\Documents\HK2 - 2025 - 2026\DL\archive (1)\dataset1\vqa_dataset\outputs

seed: 42
max_question_len: 64
max_answer_len: 10
batch_size: 8
num_workers: 2
epochs: 30
lr_a: 2.0e-4
lr_phobert: 2.0e-5
weight_decay: 0.01
patience: 3

image_size: 288
phobert_name: vinai/phobert-base

# --- PaliGemma (Hướng B) ---
# Các variant có thể dùng:
#   google/paligemma2-3b-pt-224   (nhẹ nhất, phù hợp GPU ≤8GB VRAM)
#   google/paligemma2-10b-pt-224  (mạnh hơn, cần ≥16GB VRAM)
#   google/paligemma-3b-mix-224   (PaliGemma 1, nếu chưa truy cập PaliGemma 2)
paligemma_model_name: google/paligemma2-3b-pt-224

# PaliGemma LoRA / SFT
qwen_max_length: 512       # giữ tên key để tương thích với các script train
qwen_batch_size: 1
qwen_grad_accum: 8
qwen_epochs: 2
qwen_lr: 2.0e-4
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05